<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
        <title><%= htmlWebpackPlugin.options.gameName %></title>
        <link rel="shortcut icon" href="./src/assets/favicon.ico" type="image/x-icon" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
            }

            .gameCss {
                /* opacity: 0; */
                position: absolute;
                left: 50%;
                top: 50%;
                -webkit-transform: translate(-50%, -50%);
                -moz-transform: translate(-50%, -50%);
                -ms-transform: translate(-50%, -50%);
                -o-transform: translate(-50%, -50%);
                transform: translate(-50%, -50%);
                cursor: default !important;
            }

            body,
            canvas,
            html {
                user-select: none;
            }

            #myButton {
                background-color: #4caf50; /* Green */
                border: none;
                color: white;
                padding: 15px 32px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 16px;
                /* margin: auto; */
            }

            .button-div {
                user-select: none;
                height: 100%; /* Ensure the full height is used */
                margin: 0; /* Remove default margin */
                display: flex; /* Use flexbox to center children */
                justify-content: center; /* Center horizontally */
                align-items: center; /* Center vertically */
            }
        </style>
    </head>
    <body>

        <!-- TODO - bring back the button -->
        <div class="button-div">
            <button id="myButton">Click To Play</button>
        </div>
        <div class="canvas-game"></div>

        <script>
            const customEvent = new Event('startGame');

            document.getElementById('myButton').addEventListener('click', function () {
                alert('Game is starting button click');
                window.dispatchEvent(customEvent);
                // this.remove();
            });
        </script>
    </body>
</html>
